name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  browser:
    runs-on: ubuntu-latest
    needs: verify
    # Each shard keeps the 4 workers the config allows and gets its own runner,
    # so sharding cuts wall time without raising per-job parallelism (more than
    # 4 concurrent browser workers produced protocol flakes). Shards split by
    # test count, which currently lands one engine per shard: the wall time is
    # set by the slowest engine (firefox), not by the slowest test. Shard 1 also
    # runs the dist smoke, which is independent of the test split.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # No `bun run sync` here: dist is committed (guarded by check:generated in
      # the verify job) and the browser fixtures load /src, so a per-shard build
      # would only add wall time.
      - name: Browser behavior suite (${{ matrix.shard }}/3)
        run: bun run test:browser:all --shard=${{ matrix.shard }}/3
      - name: Dist smoke
        if: matrix.shard == 1
        run: bun run test:dist
