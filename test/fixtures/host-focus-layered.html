<style>
  /* Same host contract as host-focus.html, but wrapped in a cascade layer: a
     layered host rule loses to any unlayered component declaration regardless
     of specificity, so this fixture proves the component declares nothing on
     the field at all. */
  @layer host {
    :root { --host-ok: rgb(0, 128, 0); --host-danger: rgb(200, 0, 0); }
    .input {
      min-block-size: 2.5rem;
      border: 1px solid #767676;
      border-radius: 0.5rem;
      padding: 0.45rem 0.65rem;
    }
    .input[aria-invalid="true"] { --host-focus: var(--host-danger); }
    .input:focus-visible { outline: 4px solid var(--host-focus, var(--host-ok)); outline-offset: 1px; }
  }
  body { font-family: system-ui, sans-serif; }
  .field { display: grid; gap: 0.35rem; inline-size: 18rem; margin-block: 0.75rem; }
</style>
